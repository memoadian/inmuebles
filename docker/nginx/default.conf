server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # El formulario de fotos permite hasta 20 imágenes de 8 MB c/u; el default
    # de nginx (1M) responde 413 antes de que Laravel pueda validar nada.
    client_max_body_size 170M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # fastcgi_params define HTTP_HOST como $host, que descarta el puerto.
        # Laravel construye sus URLs desde ahí, así que un redirect saldría a
        # http://localhost/... en lugar de http://localhost:8000/...
        fastcgi_param HTTP_HOST $http_host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
