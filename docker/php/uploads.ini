; Fotos de propiedades: hasta 20 archivos de 8 MB c/u (ver PropertyImageController).
; post_max_size debe cubrir el total del formulario y coincide con
; client_max_body_size en docker/nginx/default.conf.
; Un poco por encima del max:8192 de Laravel para que sea el validador (y no PHP
; con "failed to upload") quien rechace el archivo con un mensaje claro.
upload_max_filesize = 10M
post_max_size = 170M
max_file_uploads = 20

; Decodificar una foto de 12 MP en GD ocupa ~50 MB por copia.
memory_limit = 256M
